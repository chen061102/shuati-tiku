<!DOCTYPE html>

<style>
/* ============ 基础 ============ */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: #F7F7F7;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  color: #1F1F1F;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; outline: none; touch-action: manipulation; }
button:active { transform: scale(0.96); }
#app { min-height: 100%; }

/* ============ 首页 ============ */
.home { padding: calc(14px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
.home-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 14px; }
.home-title { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
.home-import { font-size: 13px; color: #576B95; padding: 6px 10px; background: #FFFFFF; border-radius: 15px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.stats-card { background: #FFFFFF; border-radius: 12px; padding: 16px 8px; display: flex; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.stats-item { flex: 1; text-align: center; }
.stats-num { font-size: 20px; font-weight: 700; color: #07C160; }
.stats-num.red { color: #FA5151; }
.stats-num.blue { color: #576B95; }
.stats-num.dark { color: #1F1F1F; }
.stats-label { font-size: 12px; color: #888; margin-top: 3px; }
.mode-card { background: #FFFFFF; border-radius: 12px; padding: 16px 16px; margin-bottom: 12px; display: flex; align-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.mode-card:active { transform: scale(0.98); }
.mode-ico { font-size: 26px; margin-right: 14px; width: 36px; text-align: center; }
.mode-info { flex: 1; }
.mode-name { font-size: 17px; font-weight: 600; }
.mode-desc { font-size: 12px; color: #999; margin-top: 3px; }
.mode-arrow { color: #C8C9CC; font-size: 20px; }
.mode-badge { background: #FA5151; color: #fff; font-size: 12px; border-radius: 9px; padding: 1px 7px; margin-left: 8px; }
.home-foot { text-align: center; padding-top: 14px; }
.home-reset { font-size: 14px; color: #B2B2B2; padding: 8px 16px; }
.home-tip { text-align: center; font-size: 11px; color: #C0C0C0; padding-top: 6px; }

/* ============ 刷题页 ============ */
.quiz { max-width: 640px; margin: 0 auto; }
.qheader {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center;
  background: #FFFFFF;
  padding: calc(6px + env(safe-area-inset-top)) 8px 6px;
  border-bottom: 1px solid #EFEFEF;
}
.hbtn { font-size: 14px; color: #1F1F1F; padding: 7px 10px; border-radius: 8px; }
.hbtn.gray { color: #888; font-size: 20px; line-height: 1; }
.hbtn.on { background: #07C160; color: #fff; }
.qtitle { flex: 1; text-align: center; }
.qt1 { font-size: 15px; font-weight: 600; }
.qt2 { font-size: 11px; color: #999; margin-top: 2px; }
.qheader .hbtns { display: flex; }

.qbody { padding: 10px 12px calc(150px + env(safe-area-inset-bottom)); }
.progress { height: 4px; background: #EFEFEF; border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
.progress-in { height: 100%; background: #07C160; border-radius: 2px; transition: width .2s; }

.chips { display: flex; gap: 8px; margin-bottom: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; font-size: 13px; padding: 6px 14px; border-radius: 15px; background: #FFFFFF; color: #576B95; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.chip.on { background: #07C160; color: #fff; }

.qcard { background: #FFFFFF; border-radius: 12px; padding: 16px 14px 18px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.qmeta { display: flex; align-items: center; margin-bottom: 10px; }
.qbadge { font-size: 12px; color: #07C160; background: #E8F8EF; border-radius: 4px; padding: 2px 8px; margin-right: 8px; }
.qbadge.m { color: #10AEFF; background: #E7F5FE; }
.qbadge.j { color: #FA9D3B; background: #FEF2E5; }
.qno { font-size: 12px; color: #999; }
.qfav { margin-left: auto; font-size: 13px; color: #FA9D3B; }
.qtext { font-size: 17px; line-height: 1.65; color: #1F1F1F; margin-bottom: 14px; user-select: text; -webkit-user-select: text; word-break: break-all; }

.noanswer { background: #FFF7E6; color: #B37B1E; font-size: 13px; border-radius: 8px; padding: 9px 12px; margin-bottom: 12px; display: flex; align-items: center; }
.noanswer .na-ico { margin-right: 6px; }

.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; align-items: center; background: #F7F8FA; border-radius: 10px; padding: 11px 12px; border: 1.5px solid transparent; transition: background .15s, transform .1s; user-select: none; -webkit-user-select: none; }
.opt:active { transform: scale(0.98); background: #EFF1F4; }
.opt-letter { width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; color: #576B95; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; margin-right: 12px; flex-shrink: 0; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.opt-text { flex: 1; font-size: 16px; line-height: 1.5; color: #333; word-break: break-all; }
.opt-mark { font-size: 18px; font-weight: 700; margin-left: 8px; }
.opt-sel { border-color: #07C160; background: #F0FAF4; }
.opt-sel .opt-letter { background: #07C160; color: #fff; }
.opt-ok { border-color: #07C160; background: #E8F8EF; }
.opt-ok .opt-letter { background: #07C160; color: #fff; }
.opt-ok .opt-text { color: #07C160; font-weight: 600; }
.opt-ok .opt-mark { color: #07C160; }
.opt-bad { border-color: #FA5151; background: #FEF0F0; }
.opt-bad .opt-letter { background: #FA5151; color: #fff; }
.opt-bad .opt-text { color: #FA5151; font-weight: 600; }
.opt-bad .opt-mark { color: #FA5151; }
.opt-ans { border-color: #07C160; background: #E8F8EF; }
.opt-ans .opt-letter { background: #07C160; color: #fff; }
.opt-dim { opacity: .55; }

.fb { border-radius: 10px; padding: 11px 14px; margin-top: 12px; font-size: 15px; font-weight: 600; }
.fb-ok { background: #E8F8EF; color: #07C160; }
.fb-bad { background: #FEF0F0; color: #FA5151; }

/* ============ 底部操作栏 ============ */
.bottombar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  background: #FFFFFF;
  border-top: 1px solid #EFEFEF;
  display: flex;
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  max-width: 640px; margin: 0 auto;
}
.bbtn { flex: 1; text-align: center; font-size: 14px; color: #576B95; padding: 8px 0; border-radius: 10px; }
.bbtn.main { color: #1F1F1F; font-weight: 600; font-size: 16px; }
.bbtn.faved { color: #FA9D3B; }
.submitbar {
  position: fixed; left: 0; right: 0; z-index: 59;
  bottom: calc(62px + env(safe-area-inset-bottom));
  padding: 0 16px 8px; max-width: 640px; margin: 0 auto;
}
.submit-btn { width: 100%; background: #07C160; color: #fff; font-size: 17px; font-weight: 600; border-radius: 12px; padding: 13px 0; box-shadow: 0 2px 8px rgba(7,193,96,.35); }
.submit-btn:active { transform: scale(0.97); }

/* ============ 答题卡抽屉 ============ */
.sheet-mask { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 90; opacity: 0; pointer-events: none; transition: opacity .2s; }
.sheet-mask.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 91;
  background: #FFFFFF; border-radius: 16px 16px 0 0;
  padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
  max-width: 640px; margin: 0 auto;
  transform: translateY(105%); transition: transform .25s;
}
.sheet.show { transform: translateY(0); }
.sheet-head { display: flex; align-items: center; margin-bottom: 12px; }
.sheet-title { font-size: 16px; font-weight: 600; }
.sheet-sub { font-size: 12px; color: #999; margin-left: 8px; }
.sheet-close { margin-left: auto; font-size: 13px; color: #576B95; padding: 6px 10px; }
.sheet-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; max-height: 55vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sc { aspect-ratio: 1; border-radius: 8px; background: #F2F3F5; color: #1F1F1F; font-size: 14px; position: relative; }
.sc:active { transform: scale(.92); }
.sc.cur { box-shadow: inset 0 0 0 2px #07C160; font-weight: 700; }
.sc.ok { background: #07C160; color: #fff; }
.sc.bad { background: #FA5151; color: #fff; }
.sc.read { background: #D8D8DA; color: #fff; }
.sc .star { position: absolute; top: -3px; right: -2px; font-size: 11px; color: #FA9D3B; }
.sheet-legend { display: flex; gap: 14px; margin-top: 12px; font-size: 11px; color: #888; flex-wrap: wrap; align-items: center; }
.sheet-legend span { display: flex; align-items: center; }
.lg { width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; display: inline-block; }
.sheet-submit { margin-left: auto; background: #FA5151; color: #fff; font-size: 13px; font-weight: 600; border-radius: 8px; padding: 7px 16px; }
.sheet-submit:active { transform: scale(.95); }

/* ============ 模拟测试 ============ */
.mode-badge.blue { background: #10AEFF; }
.hbtn.exam-submit { background: #FA5151; color: #fff; font-weight: 600; }
.sc.ans { background: #10AEFF; color: #fff; }
.rv-section { text-align: left; margin-bottom: 12px; }
.rv-section-title { font-size: 14px; font-weight: 600; color: #666; margin: 18px 0 10px; }
.rv-item { background: #FFFFFF; border-radius: 10px; margin-bottom: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.04); overflow: hidden; }
.rv-item summary { list-style: none; padding: 12px 14px; font-size: 14px; color: #333; line-height: 1.5; }
.rv-item summary::-webkit-details-marker { display: none; }
.rv-tag { display: inline-block; background: #FA5151; color: #fff; font-size: 11px; border-radius: 4px; padding: 1px 6px; margin-right: 6px; vertical-align: 1px; }
.rv-body { padding: 0 14px 14px; border-top: 1px dashed #EEE; padding-top: 10px; }
.rv-q { font-size: 14px; color: #1F1F1F; line-height: 1.6; margin-bottom: 10px; }
.rv-ans { font-size: 13px; color: #666; margin-bottom: 4px; }
.rv-bad { color: #FA5151; }
.rv-ok-txt { color: #07C160; }
.rv-opts { margin-top: 10px; }
.rv-opt { font-size: 13px; color: #555; padding: 6px 9px; border-radius: 6px; margin-bottom: 5px; background: #F7F8FA; }
.rv-opt.rv-ok { background: #E8F8EF; color: #07C160; font-weight: 600; }
.rv-un-list { background: #FFFFFF; border-radius: 10px; padding: 10px 14px; }
.rv-un-item { font-size: 13px; color: #999; line-height: 1.8; }

/* ============ 结果页 / 空状态 ============ */
.result { text-align: center; padding: calc(60px + env(safe-area-inset-top)) 24px 40px; max-width: 640px; margin: 0 auto; }
.res-emoji { font-size: 56px; }
.res-big { font-size: 52px; font-weight: 700; color: #07C160; margin: 14px 0 6px; }
.res-big.blue { color: #10AEFF; }
.res-sub { font-size: 15px; color: #666; margin-bottom: 26px; }
.res-btn { display: block; width: 100%; background: #07C160; color: #fff; font-size: 17px; font-weight: 600; border-radius: 12px; padding: 14px 0; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(7,193,96,.35); }
.res-btn.plain { background: #FFFFFF; color: #576B95; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.res-detail { background: #FFFFFF; border-radius: 12px; padding: 14px; margin-bottom: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.res-detail .rd-row { display: flex; justify-content: space-between; font-size: 14px; color: #666; padding: 5px 0; }
.res-detail .rd-row b { color: #1F1F1F; }
.empty { text-align: center; padding: calc(80px + env(safe-area-inset-top)) 30px 40px; max-width: 640px; margin: 0 auto; }
.empty-emoji { font-size: 58px; }
.empty-title { font-size: 18px; font-weight: 600; margin: 14px 0 6px; }
.empty-desc { font-size: 14px; color: #999; margin-bottom: 24px; }
.empty-btn { display: block; width: 100%; background: #07C160; color: #fff; font-size: 16px; font-weight: 600; border-radius: 12px; padding: 13px 0; }

/* ============ 弹窗 / Toast ============ */
.modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 30px; }
.modal { background: #FFFFFF; border-radius: 14px; width: 100%; max-width: 420px; padding: 20px 18px; max-height: 78vh; display: flex; flex-direction: column; }
.modal-title { font-size: 17px; font-weight: 600; text-align: center; margin-bottom: 10px; }
.modal-desc { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 14px; word-break: break-all; }
.modal-desc code { background: #F2F3F5; border-radius: 4px; padding: 1px 5px; font-size: 12px; color: #576B95; }
.modal-actions { display: flex; gap: 10px; }
.mbtn { flex: 1; border-radius: 10px; padding: 11px 0; font-size: 15px; font-weight: 600; }
.mbtn.cancel { background: #F2F3F5; color: #576B95; }
.mbtn.ok { background: #07C160; color: #fff; }
.mbtn.danger { background: #FA5151; color: #fff; }
.mbtn:active { transform: scale(.96); }
.modal textarea { width: 100%; min-height: 110px; border: 1px solid #E5E5E5; border-radius: 8px; padding: 10px; font-size: 13px; font-family: Menlo, Consolas, monospace; resize: vertical; margin-bottom: 10px; }
.modal .file-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.file-btn { font-size: 14px; color: #576B95; background: #F2F3F5; border-radius: 8px; padding: 9px 14px; }
.file-name { font-size: 12px; color: #999; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.toast { position: fixed; top: 18%; left: 50%; transform: translateX(-50%); background: rgba(17,17,17,.85); color: #fff; font-size: 14px; border-radius: 10px; padding: 11px 18px; z-index: 200; max-width: 82%; text-align: center; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>

  st.examAns = (st.examAns && typeof st.examAns === 'object' && !Array.isArray(st.examAns)) ? st.examAns : {};
  st.examStart = typeof st.examStart === 'number' ? st.examStart : 0;
  st.examHistory = Array.isArray(st.examHistory) ? st.examHistory.slice(-10) : [];
  return st;
}
function saveState() {
  /* 同步当前模式的答题记录 */
  if (mode === 'seq') S.recSeq[typeFilter] = rec;
  else if (mode === 'rand') S.recRand = rec;
  saveJSON(LS_STATE, S);
}

/* ==================== 全局状态 ==================== */
var S = loadState();
var imported = (function () {
  var arr = loadJSON(LS_IMPORTED, []);
  return Array.isArray(arr) ? arr : [];
})();
var wrongSet = new Set(S.wrong);
var favSet = new Set(S.fav);

var bank = [];        // 规范化后的全部题目
var bankMap = {};     // id -> 题目
var mode = null;      // null | 'seq' | 'rand' | 'wrong' | 'exam'
var typeFilter = 'all';

var toastTimer = null;

/* ==================== 题目规范化 ==================== */
function normalizeQuestion(raw, fallbackId) {
  raw = (raw && typeof raw === 'object') ? raw : {};
  var q = String(raw.q === undefined || raw.q === null ? '' : raw.q).replace(/\s+/g, ' ').trim();
  var a = String(raw.a === undefined || raw.a === null ? '' : raw.a).trim().toUpperCase().replace(/\s+/g, '');
  var options = {};
  if (raw.options && typeof raw.options === 'object') {
    ['A', 'B', 'C', 'D'].forEach(function (k) {
      if (raw.options[k] !== undefined && raw.options[k] !== null) {
        options[k] = String(raw.options[k]).replace(/\s+/g, ' ').trim();
      }
    });
  }
  var type = raw.type;
  if (!type) {
    if (Object.keys(options).length === 0 && (a === '√' || a === '×')) type = 'judge';
    else if (a.length > 1 && /^[A-D]+$/.test(a)) type = 'multiple';
    else type = 'single';
  }
  if (type === 'single') {
    a = /^[A-D]$/.test(a) ? a : '';
  } else if (type === 'multiple') {
    a = /^[A-D]{1,4}$/.test(a) ? a.split('').sort().join('') : '';
  } else if (type === 'judge') {
    a = (a === '√' || a === '×' || /^[A-D]$/.test(a)) ? a : '';
  } else {
    type = 'single'; a = '';
  }
  var id = (raw.id !== undefined && raw.id !== null && String(raw.id).trim() !== '') ? String(raw.id) : fallbackId;
  return { id: id, type: type, q: q, options: options, a: a };
}

function rebuildBank() {
  var seen = new Set();
  var items = QUESTION_BANK.concat(imported);
  bank = [];
  items.forEach(function (raw, i) {
    var q = normalizeQuestion(raw, 'auto-' + (i + 1));
    var id = q.id, n = 1;
    while (seen.has(id)) { id = q.id + '-' + (n++); }
    q.id = id;
    seen.add(id);
    bank.push(q);
  });
  bankMap = {};
  bank.forEach(function (q) { bankMap[q.id] = q; });
}

/* ==================== 工具 ==================== */
function escapeHtml(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function cur() {
  if (idx < 0 || idx >= list.length) return null;
  return bankMap[list[idx]];
}
function getRec(qid) {
  if (!rec[qid]) rec[qid] = { sel: [], judged: false, ok: null };
  return rec[qid];
}
function correctLetters(q) {
  if (!q.a) return [];
  if (q.type === 'judge') {
    if (q.a === '√') return ['A'];
    if (q.a === '×') return ['B'];
  }
  return q.a.split('');
}
function correctRate() {
  return S.stats.answered > 0 ? Math.round(S.stats.correct / S.stats.answered * 100) : 0;
}
function clamp(n, lo, hi) {
  if (hi < lo) return 0;
  return Math.max(lo, Math.min(n, hi));
}
function saveIdx() {
  if (mode === 'seq') S.seqIdx[typeFilter] = idx;
  if (mode === 'rand') S.randIdx = idx;
  if (mode === 'exam') S.examIdx = idx;
  saveState();
}
function toast(msg) {
  var t = document.getElementById('toastBox');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toastBox';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
}

/* ==================== 模式启动 ==================== */
function persistCurrent() {
  /* 离开当前模式前保存进度与答题记录 */
  if (mode === 'seq') { S.seqIdx[typeFilter] = idx; S.recSeq[typeFilter] = rec; saveState(); }
  else if (mode === 'rand') { S.randIdx = idx; S.recRand = rec; saveState(); }
  else if (mode === 'exam') { S.examIdx = idx; saveState(); }
}
function startSeq(filter) {
  persistCurrent();
  typeFilter = filter || 'all';
  mode = 'seq';
  finished = false;
  list = bank.filter(function (q) {
    if (typeFilter === 'all') return true;
    if (typeFilter === 'fav') return favSet.has(q.id);
    return q.type === typeFilter;
  }).map(function (q) { return q.id; });
  idx = clamp(S.seqIdx[typeFilter] || 0, 0, list.length - 1);
  rec = (S.recSeq[typeFilter] && typeof S.recSeq[typeFilter] === 'object') ? S.recSeq[typeFilter] : {};
  saveState();
  render();
}
function startRand(forceNew) {
  persistCurrent();
  mode = 'rand';
  finished = false;
  if (forceNew || S.randSet.length === 0 || S.randIdx >= S.randSet.length - 1) {
    /* 随机抽取时按题干去重：PDF 中存在少量重复题，避免同一题干被抽中两次 */
    var pool = shuffle(bank.map(function (q) { return q.id; }));
    var seenQ = new Set();
    var pool2 = [];
    pool.forEach(function (id) {
      var qq = bankMap[id];
      if (qq && !seenQ.has(qq.q)) { seenQ.add(qq.q); pool2.push(id); }
    });
    S.randSet = pool2.slice(0, 50);
    S.randIdx = 0;
    S.recRand = {};
  }
  list = S.randSet;
  idx = clamp(S.randIdx, 0, list.length - 1);
  rec = (S.recRand && typeof S.recRand === 'object') ? S.recRand : {};
  saveState();
  render();
}
function startWrong() {
  persistCurrent();
  mode = 'wrong';
  finished = false;
  rec = {};
  list = S.wrong.slice();
  idx = 0;
  render();
}
function startBack() {
  S.back = true;
  saveState();
  startSeq('all');
}
function goHome() {
  clearTimeout(autoTimer); autoTimer = null;
  persistCurrent();
  mode = null;
  finished = false;
  examFinished = false;
  examResult = null;
  list = [];
  render();
}
function switchFilter(f) {
  clearTimeout(autoTimer); autoTimer = null;
  startSeq(f);
}
function toggleBack() {
  S.back = !S.back;
  saveState();
  if (mode) render();
  else renderHome();
}

/* ==================== 答题逻辑 ==================== */
function tapOption(letter) {
  var q = cur();
  if (!q) return;
  var r = getRec(q.id);
  /* 无答案题 / 背题模式：点击即已读，自动下一题 */
  if (!q.a || S.back) {
    if (r.judged) return;
    r.sel = [letter];
    r.judged = true;
    r.ok = null;
    r.read = true;
    render();
    scheduleNext(400);
    return;
  }
  if (r.judged) return;
  if (q.type === 'multiple') {
    var i = r.sel.indexOf(letter);
    if (i >= 0) r.sel.splice(i, 1);
    else r.sel.push(letter);
    renderOpts();
    renderSubmitBar();
    return;
  }
  /* 单选 / 判断：立即判定 */
  r.sel = [letter];
  r.judged = true;
  var corr = correctLetters(q);
  r.ok = corr.length > 0 && corr.indexOf(letter) >= 0;
  afterJudge(q, r);
}
function submitMulti() {
  var q = cur();
  if (!q || q.type !== 'multiple') return;
  if (!q.a || S.back) return; /* 无答案/背题已读逻辑 */
  var r = getRec(q.id);
  if (r.judged) return;
  if (r.sel.length === 0) { toast('请先选择至少一个选项'); return; }
  r.judged = true;
  var corr = correctLetters(q);
  var sorted = r.sel.slice().sort().join('');
  r.ok = corr.length > 0 && sorted === corr.slice().sort().join('');
  afterJudge(q, r);
}
function afterJudge(q, r) {
  if (r.ok) {
    S.stats.answered++;
    S.stats.correct++;
    S.streak[q.id] = (S.streak[q.id] || 0) + 1;
    if (wrongSet.has(q.id) && S.streak[q.id] >= 2) {
      removeWrong(q.id);
      toast('已连续答对 2 次，移出错题本 ✓');
    }
    render();
    scheduleNext(400);
  } else {
    S.stats.answered++;
    S.streak[q.id] = 0;
    addWrong(q.id);
    render();
  }
  saveState();
}
function addWrong(qid) {
  if (!wrongSet.has(qid)) {
    wrongSet.add(qid);
    S.wrong.push(qid);
    saveState();
  }
}
function removeWrong(qid) {
  if (wrongSet.has(qid)) {
    wrongSet.delete(qid);
    S.wrong = S.wrong.filter(function (x) { return x !== qid; });
    saveState();
  }
}
function scheduleNext(delay) {
  clearTimeout(autoTimer);
  autoTimer = setTimeout(function () {
    autoTimer = null;
    next();
  }, delay);
}
function next() {
  clearTimeout(autoTimer); autoTimer = null;
  if (mode === 'wrong') { list = S.wrong.slice(); }
  if (list.length === 0) { render(); return; }
  if (idx >= list.length - 1) { finish(); return; }
  idx++;
  saveIdx();
  render();
}
function prev() {
  clearTimeout(autoTimer); autoTimer = null;
  if (idx > 0) {
    idx--;
    saveIdx();
    render();
  }
}
function jumpTo(i) {
  closeSheet();
  clearTimeout(autoTimer); autoTimer = null;
  if (i < 0 || i >= list.length) return;
  idx = i;
  saveIdx();
  render();
}
function finish() {
  finished = true;
  if (mode === 'seq') { S.seqIdx[typeFilter] = 0; S.recSeq[typeFilter] = {}; }
  if (mode === 'rand') { S.randSet = []; S.randIdx = 0; S.recRand = {}; }
  saveState();
  render();
}
function restartCurrent() {
  finished = false;
  if (mode === 'seq') {
    rec = {};
    idx = 0;
    S.recSeq[typeFilter] = {};
    saveIdx();
    render();
  }
  else if (mode === 'rand') { startRand(true); }
  else if (mode === 'wrong') { startWrong(); }
}

/* ==================== 模拟测试（200题：150单选 + 50多选/判断） ==================== */
function startExam(forceNew) {
  persistCurrent();
  mode = 'exam';
  finished = false;
  examFinished = false;
  examResult = null;
  if (forceNew || S.examSet.length === 0) {
    /* 抽题：按题干去重、排除无答案题；150 单选 + 50 多选/判断 */
    var seenQ = new Set();
    function examPool(types) {
      var pool = [];
      bank.forEach(function (q) {
        if (types.indexOf(q.type) < 0) return;
        if (!q.a) return;
        if (seenQ.has(q.q)) return;
        seenQ.add(q.q);
        pool.push(q.id);
      });
      return shuffle(pool);
    }
    S.examSet = examPool(['single']).slice(0, 150)
      .concat(examPool(['multiple', 'judge']).slice(0, 50));
    S.examIdx = 0;
    S.examAns = {};
    S.examStart = Date.now();
  }
  list = S.examSet;
  idx = clamp(S.examIdx, 0, list.length - 1);
  saveState();
  render();
}
function examPick(letter) {
  var q = cur();
  if (!q) return;
  var sel = (S.examAns[q.id] || []).slice();
  if (q.type === 'multiple') {
    var i = sel.indexOf(letter);
    if (i >= 0) sel.splice(i, 1); else sel.push(letter);
  } else {
    if (sel.length === 1 && sel[0] === letter) sel = [];  /* 再次点击取消选择 */
    else sel = [letter];
  }
  if (sel.length === 0) delete S.examAns[q.id];
  else S.examAns[q.id] = sel;
  saveState();
  renderExamOpts();
  updateExamHeader();
}
function examNext() {
  if (idx >= list.length - 1) { toast('已是最后一题，请点右上角「交卷」'); return; }
  idx++;
  saveIdx();
  render();
}
function examPrev() {
  if (idx <= 0) return;
  idx--;
  saveIdx();
  render();
}
function examAnsweredCount() {
  var n = 0;
  list.forEach(function (id) { if (S.examAns[id] && S.examAns[id].length > 0) n++; });
  return n;
}
function submitExam() {
  var unanswered = list.length - examAnsweredCount();
  if (unanswered > 0) {
    openConfirm('确认交卷', '还有 <b>' + unanswered + '</b> 道题未作答，未答题目按错误计分。确定交卷吗？', '确定交卷', doSubmitExam);
  } else {
    doSubmitExam();
  }
}
function doSubmitExam() {
  closeModal();
  var ok = [], bad = [], un = [];
  list.forEach(function (id) {
    var q = bankMap[id];
    if (!q) return;
    var sel = (S.examAns[id] || []).slice().sort();
    var corr = correctLetters(q).slice().sort();
    if (sel.length === 0) { un.push(id); return; }
    if (sel.join('') === corr.join('')) ok.push(id);
    else bad.push(id);
  });
  /* 计入全局统计；答错题加入错题本 */
  S.stats.answered += ok.length + bad.length;
  S.stats.correct += ok.length;
  bad.forEach(function (id) {
    S.streak[id] = 0;
    addWrong(id);
  });
  var duration = S.examStart ? Math.max(1, Math.round((Date.now() - S.examStart) / 1000)) : 0;
  var record = {
    date: Date.now(),
    total: list.length,
    correct: ok.length,
    wrong: bad.length,
    unanswered: un.length,
    rate: list.length > 0 ? Math.round(ok.length / list.length * 100) : 0,
    duration: duration
  };
  S.examHistory.unshift(record);
  S.examHistory = S.examHistory.slice(0, 10);
  examResult = {
    ok: ok, bad: bad, un: un, record: record,
    answers: JSON.parse(JSON.stringify(S.examAns))
  };
  S.examSet = [];
  S.examIdx = 0;
  S.examAns = {};
  S.examStart = 0;
  examFinished = true;
  saveState();
  render();
}
function examAnswerText(q) {
  var sel = S.examAns[q.id] || [];
  if (sel.length === 0) return '未作答';
  if (q.type === 'judge') {
    return sel.map(function (L) { return L === 'A' ? '正确(√)' : '错误(×)'; }).join('、');
  }
  return sel.join('');
}
function examCorrectText(q) {
  if (q.type === 'judge') return q.a === '√' ? '正确(√)' : '错误(×)';
  return q.a;
}

function toggleFav() {
  var q = cur();
  if (!q) return;
  if (favSet.has(q.id)) {
    favSet.delete(q.id);
    S.fav = S.fav.filter(function (x) { return x !== q.id; });
  } else {
    favSet.add(q.id);
    S.fav.push(q.id);
  }
  saveState();
  renderQuiz();
}

function judgeOptions(q) {

function renderOpts() {
  var q = cur();

  if (!q || !box) return;
  var r = getRec(q.id);
  var opts = judgeOptions(q);
  var corr = correctLetters(q);
  var html = '';
  Object.keys(opts).forEach(function (L) {
    var sel = r.sel.indexOf(L) >= 0;
    var isAns = corr.indexOf(L) >= 0;
    var cls = 'opt';
    if (r.judged && q.a) {
      if (isAns) cls += ' opt-ok';
      else if (sel) cls += ' opt-bad';
      else cls += ' opt-dim';
    } else if (r.judged) {
      cls += ' opt-dim'; /* 已读（无答案/背题） */
    } else if (sel) {
      cls += ' opt-sel';
    } else if (S.back && isAns) {
      cls += ' opt-ans';
    }
    var mark = '';
    if (r.judged && q.a && isAns) mark = '<span class="opt-mark ok">✓</span>';
    if (r.judged && q.a && !isAns && sel) mark = '<span class="opt-mark bad">✕</span>';
    html += '<div class="' + cls + '" onclick="tapOption(\'' + L + '\')">' +
      '<span class="opt-letter">' + L + '</span>' +
      '<span class="opt-text">' + escapeHtml(opts[L]) + '</span>' +
      mark + '</div>';
  });
  box.innerHTML = html;
}

var impFileContent = '';
function onImpFile(input) {
  var f = input.files && input.files[0];
  if (!f) return;
  document.getElementById('impFileName').textContent = f.name;
  var reader = new FileReader();
  reader.onload = function () {
    impFileContent = String(reader.result || '');
    var ta = document.getElementById('impText');
    if (ta) ta.value = impFileContent;
  };
  reader.onerror = function () { toast('文件读取失败'); };
  reader.readAsText(f, 'utf-8');
}
function applyImport() {
  var ta = document.getElementById('impText');
  var text = ta ? ta.value : '';
  if (!text.trim()) {
    if (impFileContent) text = impFileContent;
    else { toast('请先粘贴 JSON 或选择文件'); return; }
  }
  var data;
  try { data = JSON.parse(text); }
  catch (e) { toast('JSON 解析失败：' + e.message); return; }
  if (!Array.isArray(data)) {
    if (data && Array.isArray(data.questions)) data = data.questions;
    else if (data && Array.isArray(data.bank)) data = data.bank;
    else { toast('格式错误：应为题目数组'); return; }
  }
  var existQ = new Set(bank.map(function (x) { return x.q; }));
  var existId = new Set(bank.map(function (x) { return x.id; }));
  var add = [], ok = 0, skip = 0, bad = 0;
  data.forEach(function (raw, i) {
    if (!raw || typeof raw !== 'object' || raw.q === undefined || raw.q === null || !String(raw.q).trim()) { bad++; return; }
    var nq = normalizeQuestion(raw, 'imp-' + (imported.length + add.length + 1));
    if (existQ.has(nq.q)) { skip++; return; }
    var id = nq.id, n = 1;
    while (existId.has(id)) { id = nq.id + '-' + (n++); }
    nq.id = id;
    existId.add(id);
    existQ.add(nq.q);
    add.push(nq);
    ok++;
  });
  if (add.length > 0) {
    imported = imported.concat(add);
    saveJSON(LS_IMPORTED, imported);
    rebuildBank();
  }
  closeModal();
  var msg = '导入完成：新增 ' + ok + ' 题';
  if (skip > 0) msg += '，跳过重复 ' + skip + ' 题';
  if (bad > 0) msg += '，无效 ' + bad + ' 条';
  toast(msg);
  if (mode === null) renderHome();
}

/* ==================== 重置进度（二次确认） ==================== */
var resetStage = 0;
var resetTimer = null;
function openReset() {
  resetStage = 0;
  renderResetModal();
}
function renderResetModal() {
  var root = document.getElementById('modalRoot');
  if (!root) {
    root = document.createElement('div');
    root.id = 'modalRoot';
    document.body.appendChild(root);
  }
  var btnHtml = resetStage === 0
    ? '<button class="mbtn danger" onclick="resetStage1()">确定重置</button>'
    : '<button class="mbtn danger" onclick="resetStage2()">再次点击确认重置（' + resetStage + 's）</button>';
  var desc = resetStage === 0
    ? '将清空：刷题进度、正确率统计、错题本、收藏、连续答对记录。此操作不可恢复！'
    : '为防止误触，请再次点击确认。';
  root.innerHTML =
    '<div class="modal-mask" onclick="if(event.target===this){closeModal();resetStage=0;clearTimeout(resetTimer);}">' +
    '<div class="modal">' +
    '<div class="modal-title">重置进度</div>' +
    '<div class="modal-desc">' + desc + '</div>' +
    '<div class="modal-actions">' +
    '<button class="mbtn cancel" onclick="closeModal();resetStage=0;clearTimeout(resetTimer);">取消</button>' +
    btnHtml +
    '</div></div></div>';
}
function resetStage1() {
  resetStage = 3;
  renderResetModal();
  clearTimeout(resetTimer);
  resetTimer = setInterval(function () {
    resetStage--;
    if (resetStage <= 0) { clearInterval(resetTimer); renderResetModal(); }
    else { renderResetModal(); }
  }, 1000);
}
function resetStage2() {
  clearTimeout(resetTimer);
  resetStage = 0;
  try { localStorage.removeItem(LS_STATE); } catch (e) {}
  try { localStorage.removeItem(LS_IMPORTED); } catch (e) {}
  S = loadState();
  imported = [];
  wrongSet = new Set();
  favSet = new Set();
  rebuildBank();
  closeModal();
  mode = null;
  finished = false;
  examFinished = false;
  examResult = null;
  rec = {};
  list = [];
  idx = 0;
  render();
  toast('进度已重置');
}
function closeModal() {
  var root = document.getElementById('modalRoot');
  if (root) root.innerHTML = '';
}

/* ==================== 备份 / 恢复数据（换手机/换链接不丢进度） ==================== */
function openBackup() {
  closeModal();
  var root = document.getElementById('modalRoot');
  if (!root) {
    root = document.createElement('div');
    root.id = 'modalRoot';
    document.body.appendChild(root);
  }
  root.innerHTML =
    '<div class="modal-mask" onclick="if(event.target===this)closeModal()">' +
    '<div class="modal">' +
    '<div class="modal-title">备份 / 恢复数据</div>' +
    '<div class="modal-desc">导出备份文件保存到手机后，即使更换链接、更换手机，也能一键恢复全部进度、错题本与收藏。建议定期备份。</div>' +
    '<div class="modal-actions">' +
    '<button class="mbtn ok" onclick="exportBackup()">⬇️ 导出备份</button>' +
    '<button class="mbtn cancel" onclick="document.getElementById(\'bakFile\').click()">⬆️ 从备份恢复</button>' +
    '<input type="file" id="bakFile" accept=".json,application/json" style="display:none" onchange="restoreBackupFile(this)">' +
    '</div></div></div>';
}
function exportBackup() {
  try {
    var data = { app: 'shuatibank', exportedAt: new Date().toISOString(), state: S, imported: imported };
    var blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '刷题备份-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      try { document.body.removeChild(a); URL.revokeObjectURL(url); } catch (e) {}
    }, 200);
    toast('备份已导出');
  } catch (e) {
    toast('导出失败，请用手机浏览器操作');
  }
}
function restoreBackupFile(input) {
  var f = input.files && input.files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function () { restoreBackup(String(reader.result || '')); };
  reader.onerror = function () { toast('备份文件读取失败'); };
  reader.readAsText(f, 'utf-8');
}
function restoreBackup(text) {
  try {
    var data = JSON.parse(text);
    if (!data || typeof data !== 'object' || !data.state || typeof data.state !== 'object') {
      toast('备份文件格式错误');
      return;
    }
    saveJSON(LS_STATE, data.state);
    saveJSON(LS_IMPORTED, Array.isArray(data.imported) ? data.imported : []);
    S = loadState();
    imported = Array.isArray(data.imported) ? data.imported : [];
    wrongSet = new Set(S.wrong);
    favSet = new Set(S.fav);
    rebuildBank();
    mode = null;
    finished = false;
    examFinished = false;
    examResult = null;
    rec = {};
    list = [];
    idx = 0;
    clearTimeout(autoTimer);
    autoTimer = null;
    closeModal();
    render();
    toast('数据恢复成功');
  } catch (e) {
    toast('恢复失败：' + e.message);
  }
}

/* ==================== 微信端适配 ==================== */
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
document.addEventListener('dblclick', function (e) { e.preventDefault(); });
document.addEventListener('touchmove', function (e) {
  if (e.touches && e.touches.length > 1) e.preventDefault();
}, { passive: false });

/* ==================== 启动 ==================== */
rebuildBank();
render();

/* ==================== 离线缓存注册（PWA：打开一次即永久离线） ==================== */
if ('serviceWorker' in navigator && /^https?:$/.test(window.location.protocol)) {
  window.addEventListener('load', function () {
    try {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    } catch (e) { /* 不支持则忽略，应用仍可在线使用 */ }
  });
}
</script>
